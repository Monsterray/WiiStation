; WiiStation example settings
; ===========================
; This file shows each setting with its default value.
; WiiStation does not read this file. It reads settings.ini in the same folder.
; To change a setting, copy its line into settings.ini and change the value.
; A setting that is not in settings.ini keeps its default value.
;
; Rules:
;   - Write one "key = value" on each line.
;   - Put text values in double quotes: MenuFont = "Segoe".
;   - A line that starts with ";" or "#" is a comment. WiiStation ignores it.
;   - WiiStation ignores the [section] lines. They are only there to help you.
;   - The menu (Settings > Save Settings) writes settings.ini again with all the settings.
;
; A game can have its own settings: put them in settings/<disc serial>.ini,
; for example settings/SLUS00067.ini. These lines replace the lines of settings.ini
; for that game only. SETTINGS.md has more data about each setting.


[General]
; The menu and the emulator.

; The language of the menu.
; 0 = English, 1 = Simplified Chinese, 2 = Korean, 3 = Spanish, 4 = Portuguese,
; 5 = Italian, 6 = German, 7 = Traditional Chinese, 8 = Japanese, 9 = French,
; 10 = Brazilian Portuguese, 11 = Catalan, 12 = Turkish.
lang = 0

; The font of the menu: the name of a file in wiistation/fonts/, without ".dat".
; "" = the built-in font. Chinese, Japanese and Korean use their own fonts.
MenuFont = ""

; The order of the file list. 0 = folders and files together, 1 = folders first.
FileSortMode = 1

; The CPU emulator. 0 = Lightrec (fast), 1 = Interpreter (slow, for tests),
; 2 = old Dynarec. A change resets the game.
Core = 0

; 0 = the disc drive has the speed of a PlayStation drive.
; 1 = the disc drive answers faster, so loading screens are shorter.
; Some games do not work with 1. Music and video from the disc can stop.
fastLoad = 0


[Files]
; Where WiiStation finds the games and the BIOS.

; The game folders on the SD card. Use a comma between two folders.
; Load ROM > Load from SD shows these folders. If only one folder exists, it opens.
; Example: RomDirSD = "/wiistation/isos, /roms/psx"
RomDirSD = "/wiistation/isos"

; The game folders on the USB device. The rules are the same as RomDirSD.
RomDirUSB = "/wiistation/isos"

; The BIOS. 0 = HLE (the built-in BIOS), 1 = SD card, 2 = USB device.
; For 1 and 2, put SCPH1001.BIN in wiistation/bios/. If the file is not there,
; WiiStation uses HLE.
BiosDevice = 0

; 1 = show the PlayStation start screen before the game. This needs a BIOS file.
BootThruBios = 0


[Video]
; The picture: the renderer, the TV signal and the filters.

; The renderer. 0 = Soft Fast and 1 = Soft Timed draw with the CPU.
; 2 = OpenGX draws with the Wii graphics hardware. A change resets the game.
gpuPlugin = 0

; The TV signal. 0 = Auto (the Wii setting), 1 = NTSC, 2 = PAL 50 Hz,
; 3 = PAL 60 Hz, 4 = Progressive (480p).
VideoMode = 0

; 1 = 240p: the original PlayStation resolution. 0 = the normal Wii resolution.
TVMode = 0

; 1 = run a PAL game at 60 Hz (NTSC speed).
ForceNTSC = 0

; The shape of the picture. 0 = 4:3, 1 = 16:9, 2 = 16:9 with bars at the sides.
ScreenMode = 0

; 1 = interlaced output.
Interlaced = 0

; 1 = the deflicker filter of the Wii. It makes the picture softer and stops flicker.
DeflickerFilter = 1

; 1 = the video trap filter of the Wii.
TrapFilter = 1

; The texture filter of OpenGX. 0 = default, 1 = Near (sharp pixels),
; 2 = Bilinear (smooth).
BilinearFilter = 1

; The dither pattern of PlayStation colors. 0 = never, 1 = when the game asks for it,
; 2 = always.
Dithering = 1

; The colors of game videos. 0 = Sharp (as on a PlayStation), 1 = Smooth.
MdecChroma = 0

; The color depth of game videos. 0 = 15-bit (it can show color bands),
; 1 = 24-bit (as on a PlayStation).
FmvColour = 1

; 1 = run at the speed of a PlayStation. 0 = no speed limit.
; A controller button can change this during a game. That change is not saved.
LimitFrames = 1

; 1 = skip frames when the emulator is too slow.
SkipFrames = 0

; 1 = show the frame rate on the screen.
FPS = 0

; OpenGX only. When a game reads the picture back: 0 = Auto, 1 = always copy it,
; 2 = never copy it. Use 0. The other values are for tests.
EfbSync = 0


[Audio]
; The sound.

; 1 = sound on. 0 = no sound.
Audio = 1

; 0 = the CPU plays the sound. 1 = the DSP of the Wii mixes the sound,
; so the CPU has less work. The change starts at the next game.
SoundHwAccel = 0

; How the sound changes from 44100 Hz to 48000 Hz.
; 0 = Hold (the old way), 1 = Linear, 2 = Cubic (the best quality).
SoundResampler = 2

; 1 = keep the sound smooth: the output plays up to 0.5 % faster or slower.
; You cannot hear this change.
SoundRateControl = 1

; 1 = the old way to keep the sound smooth. Speech can then have short gaps.
; Use SoundRateControl.
SoundTempo = 0

; 1 = the reverb effect of the PlayStation (hall, room, echo).
SoundReverb = 1

; 1 = Hi-Fi: the mixer rounds each value. 0 = Legacy: the mixer cuts each value.
SoundMixerPrecision = 1

; How speech and music from the disc change to 44100 Hz.
; 1 = Hi-Fi (the filter of the PlayStation). 0 = Legacy.
SoundXaResampler = 1

; The interpolation of the sound voices. 1 = Simple, 2 = Gaussian (as on a PlayStation).
Interpolation = 2

; 1 = mute the XA streams of the disc (most music and speech).
DisableXa = 0

; 1 = mute the CD audio tracks of the disc.
DisableCdda = 0


[Timing]
; Fast timing or PlayStation timing. Fast is the default.
; Accurate timing makes the game run as on a PlayStation, but a recorded input
; can then play differently.

; The time the CPU waits for the GTE (3D math) and for multiply and divide.
; 0 = Fast, 1 = Accurate. Lightrec only.
CpuTiming = 0

; The time the GPU is busy with a draw list or a transfer.
; 0 = Fast, 1 = Accurate. OpenGX and Soft Fast only.
GpuTiming = 0

; The time a byte on the controller ports takes. 0 = Fast, 1 = Accurate.
SioTiming = 0


[Performance]
; Disc reads and the frame limiter. Keep the defaults.

; The read buffer of each disc file. 0 = 16 KB, 1 = 64 KB, 2 = 256 KB.
; Use 0: a larger buffer does not make reads faster.
CdBuffer = 0

; 1 = read the next sectors of the disc before the game asks for them.
; This is for .bin/.cue and .iso files. It does not change CHD or PBP files.
CdPrefetch = 1

; The number of CHD blocks that stay in memory. 0 = 2, 1 = 4, 2 = 8.
; A higher value decodes less often. 8 uses about 160 KB.
CdChdHunks = 2

; How the frame limiter waits. 0 = Spin (the CPU stays busy).
; 1 = Sleep (other tasks, such as disc reads, can run).
LimiterWait = 1

; How much lost time the frame limiter gets back after a slow frame.
; 0 = Short (up to 12.5 ms), 1 = Long (up to 125 ms).
LimiterDebt = 1

; The locked cache of the Wii CPU, for measurements. Add the values of the parts:
; 1 = the sound interpolation table, 2 = the OpenGX texture tiles. 0 = off.
LockedCache = 0


[Saves]
; Memory cards and save states.

; Where the memory card files are. 0 = SD card, 1 = USB device,
; 2 = GameCube memory card in slot A, 3 = GameCube memory card in slot B.
NativeDevice = 0

; Where the save states are. 0 = SD card, 1 = USB device.
StatesDevice = 0

; 1 = write the memory cards to the card when you stop a game.
AutoSave = 1

; Memory card 1. 0 = no card, 1 = a card is in the slot.
Memcard0 = 1

; The file of memory card 1. 0 = Shared (one card for all games, shared1.mcd),
; 1 = Game (one card for each game, <disc serial>.mcd).
Memcard0File = 1

; Memory card 2. 0 = no card, 1 = a card is in the slot.
Memcard1 = 1

; The file of memory card 2. 0 = Shared (shared2.mcd), 1 = Game (<disc serial>-2.mcd).
Memcard1File = 0


[Controllers]
; The PlayStation ports and the controllers on them.

; 1 = WiiStation connects the controllers. 0 = you set the ports below
; (Settings > Input > Configure Input > Manual).
PadAutoAssign = 1

; The PlayStation controller that the game sees.
; 0 = Standard (digital pad), 1 = Analog (DualShock),
; 2 = Stick D-pad (a digital pad: the left stick also pushes the D-pad).
ControllerType = 0

; 1 = the controllers rumble.
RumbleEnabled = 1

; The button mapping to load at start. 0 to 3 = mapping slot 1 to 4,
; 4 = the default mapping.
LoadButtonSlot = 4

; The light gun or mouse. 0 = off, 1 = GunCon, 2 = Justifier, 3 = Mouse.
; The pointer of the Wii Remote moves it.
LightGun = 0

; Each port has three settings. Ports 1 and 2 are the PlayStation ports.
; Ports 3 to 6 are the multitap slots A to D on port 1.
; Ports 7 to 10 are the multitap slots A to D on port 2.
;   PadTypeN:     the controller type.
;                 0 = none, 1 = GameCube controller, 2 = Wii controller,
;                 3 = USB (HID) controller, 4 = multitap (ports 1 and 2 only),
;                 5 = Co-Op (ports 1 and 2 only, see [Co-Op]).
;   PadAssignN:   which controller of that type: 0 to 3 = controller 1 to 4.
;   PadLightgunN: 1 = the light gun or mouse can use this port.
; With PadAutoAssign = 1, WiiStation sets PadType and PadAssign itself.
PadType1 = 0
PadAssign1 = 0
PadLightgun1 = 1
PadType2 = 0
PadAssign2 = 1
PadLightgun2 = 1
PadType3 = 1
PadAssign3 = 0
PadLightgun3 = 1
PadType4 = 1
PadAssign4 = 1
PadLightgun4 = 1
PadType5 = 1
PadAssign5 = 2
PadLightgun5 = 1
PadType6 = 1
PadAssign6 = 3
PadLightgun6 = 1
PadType7 = 1
PadAssign7 = 0
PadLightgun7 = 1
PadType8 = 1
PadAssign8 = 1
PadLightgun8 = 1
PadType9 = 1
PadAssign9 = 2
PadLightgun9 = 1
PadType10 = 1
PadAssign10 = 3
PadLightgun10 = 1


[Co-Op]
; More than one controller on one PlayStation port.
; Set PadType1 or PadType2 to 5 to use this. Each player can push the buttons of
; their layout. When two players push the same stick, the larger push wins.

; The number of players on port 1 and on port 2: 1 to 8.
CoopPlayers1 = 2
CoopPlayers2 = 2

; Each player has three settings. CoopPTypeK is player K on port P.
;   CoopPTypeK:   the controller type. 0 = none, 1 = GameCube controller,
;                 2 = Wii controller, 3 = USB (HID) controller.
;   CoopPAssignK: which controller of that type: 0 to 3 = controller 1 to 4.
;   CoopPLayoutK: the buttons of the player. 0 = all, 1 = left half,
;                 2 = right half, 3 = D-pad and sticks, 4 = the four action buttons,
;                 5 = the shoulder buttons.
; The defaults: players 1 to 4 use GameCube controllers 1 to 4,
; players 5 to 8 use Wii controllers 1 to 4. All players have all the buttons.
Coop1Type1 = 1
Coop1Assign1 = 0
Coop1Layout1 = 0
Coop1Type2 = 1
Coop1Assign2 = 1
Coop1Layout2 = 0
Coop1Type3 = 1
Coop1Assign3 = 2
Coop1Layout3 = 0
Coop1Type4 = 1
Coop1Assign4 = 3
Coop1Layout4 = 0
Coop1Type5 = 2
Coop1Assign5 = 0
Coop1Layout5 = 0
Coop1Type6 = 2
Coop1Assign6 = 1
Coop1Layout6 = 0
Coop1Type7 = 2
Coop1Assign7 = 2
Coop1Layout7 = 0
Coop1Type8 = 2
Coop1Assign8 = 3
Coop1Layout8 = 0
Coop2Type1 = 1
Coop2Assign1 = 0
Coop2Layout1 = 0
Coop2Type2 = 1
Coop2Assign2 = 1
Coop2Layout2 = 0
Coop2Type3 = 1
Coop2Assign3 = 2
Coop2Layout3 = 0
Coop2Type4 = 1
Coop2Assign4 = 3
Coop2Layout4 = 0
Coop2Type5 = 2
Coop2Assign5 = 0
Coop2Layout5 = 0
Coop2Type6 = 2
Coop2Assign6 = 1
Coop2Layout6 = 0
Coop2Type7 = 2
Coop2Assign7 = 2
Coop2Layout7 = 0
Coop2Type8 = 2
Coop2Assign8 = 3
Coop2Layout8 = 0


[Network]
; Games from a network share (SMB). Load ROM > Load from SMB uses these settings.

; The IP address of the computer with the share. Example: smbipaddr = "192.168.1.10"
smbipaddr = ""

; The name of the share. Example: smbsharename = "games"
smbsharename = ""

; The user name for the share.
smbusername = ""

; The password for the share.
smbpassword = ""
